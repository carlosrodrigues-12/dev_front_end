<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="stylesheet" href="../css/cadastro_usuario.css">
  
  <title>Cadastro de Usuário</title>
</head>
<body>
  <div class="form-container">
    <h1>Cadastro de Usuário</h1>

    <form action="../home/home.html" method="get">
      
      <div class="form-group">
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
      </div>

      <div class="form-group">
        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
      </div>

      <div class="form-group">
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="seuemail@dominio.com" required>
      </div>

      <div class="form-group">
        <label for="profissao">Profissão:</label>
        <input type="text" id="profissao" name="profissao" placeholder="Digite sua profissão">
      </div>

      <div class="form-group">
        <label for="data_nascimento">Data de Nascimento:</label>
        <input type="date" id="data_nascimento" name="data_nascimento" required>
      </div>

      <fieldset>
        <legend>Endereço</legend>
        <div class="address-grid">
            <div class="form-group full-width">
              <label for="logradouro">Logradouro:</label>
              <input type="text" id="logradouro" name="logradouro" placeholder="Ex: Rua, Avenida, etc.">
            </div>

            <div class="form-group">
              <label for="numero">Número:</label>
              <input type="text" id="numero" name="numero">
            </div>

            <div class="form-group">
              <label for="cep">CEP:</label>
              <input type="text" id="cep" name="cep" placeholder="00000-000" maxlength="9">
            </div>

             <div class="form-group">
              <label for="quadra">Quadra:</label>
              <input type="text" id="quadra" name="quadra">
            </div>

            <div class="form-group">
              <label for="lote">Lote:</label>
              <input type="text" id="lote" name="lote">
            </div>
            
            <div class="form-group full-width">
              <label for="bairro">Bairro:</label>
              <input type="text" id="bairro" name="bairro">
            </div>

            <div class="form-group">
              <label for="cidade">Cidade:</label>
              <select id="cidade" name="cidade">
                <option value="" disabled selected>Selecione uma cidade</option>
                <option value="brasilia">Brasília</option>
                <option value="sao_paulo">São Paulo</option>
                <option value="rio_de_janeiro">Rio de Janeiro</option>
                <option value="belo_horizonte">Belo Horizonte</option>
              </select>
            </div>

            <div class="form-group">
              <label for="estado">Estado:</label>
              <select id="estado" name="estado">
                <option value="" disabled selected>Selecione um estado</option>
                <option value="DF">Distrito Federal</option>
                <option value="SP">São Paulo</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="MG">Minas Gerais</option>
              </select>
            </div>
        </div>
      </fieldset>

      <button type="submit">Salvar</button>

    </form>
  </div>
</body>
</html>
