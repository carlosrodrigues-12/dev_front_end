<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L & C calculadora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    
  <div class="calculadora-container">
    <header>
      <h1>L & C Calculadora</h1>
    </header>
    <main class="formulario">

      <div class="campo-grupo">
        <label for="numero1">Primeiro Número:</label>
        <input type="number" id="numero1" placeholder="Digite o primeiro número">
      </div>
      <div class="campo-grupo">
        <label for="operador">Operador:</label>
        <select id="operador">
          <option value="+">+</option>
          <option value="-">-</option>
          <option value="*">*</option>
          <option value="/">/</option>
        </select>
      </div>

      <div class="campo-grupo">
        <label for="numero2">Segundo Número:</label>
        <input type="number" id="numero2" placeholder="Digite o segundo número">
      </div>

      <button onclick="calcular()">Calcular Resultado</button>

      <div class="campo-grupo resultado-grupo">
        <label for="resultado">Resultado:</label>
        <input type="text" id="resultado" readonly >
      </div>

      <p id="mensagem-erro" class="mensagem-erro"></p>
    </main>
  </div>

  <script src="calculadora.js"></script>
</body>
</html>
