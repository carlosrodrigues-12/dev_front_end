<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGCPD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-100">
    <div class="screen-container">
        <!-- Tela de Login -->
        <div id="login-screen" class="screen active">
            <div class="text-center mb-4">
                <h1 class="text-4xl font-bold text-gray-900 mb-2">SGCPD</h1>
                <p class="text-lg text-gray-600">Sistema de Gerenciamento de Conteúdo Pessoal Dinâmico</p>
            </div>
            <div class="space-y-4">
                <input type="email" id="login-email" placeholder="E-mail" class="w-full p-4 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="password" id="login-password" placeholder="Senha" class="w-full p-4 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button onclick="handleLogin()" class="w-full bg-blue-600 text-white p-4 rounded-xl font-semibold hover:bg-blue-700 transition-colors">Entrar</button>
            <div class="text-center mt-4">
                <a href="#" class="text-blue-600 hover:underline text-sm font-medium">Esqueceu a senha?</a>
                <p class="text-sm text-gray-500 mt-2">Não tem uma conta? <a onclick="navigate('register-screen')" class="text-blue-600 hover:underline cursor-pointer font-medium">Cadastre-se</a></p>
            </div>
        </div>

        <!-- Tela de Cadastro -->
        <div id="register-screen" class="screen">
            <div class="text-center mb-4">
                <h1 class="text-4xl font-bold text-gray-900 mb-2">Cadastre-se</h1>
                <p class="text-lg text-gray-600">Crie sua conta para começar</p>
            </div>
            <div class="space-y-4">
                <input type="text" placeholder="Nome Completo" class="w-full p-4 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="email" placeholder="E-mail" class="w-full p-4 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="password" placeholder="Senha" class="w-full p-4 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="password" placeholder="Confirmar Senha" class="w-full p-4 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button onclick="showMessage('Cadastro realizado com sucesso! Redirecionando para a tela de login...', 'login-screen')" class="w-full bg-green-600 text-white p-4 rounded-xl font-semibold hover:bg-green-700 transition-colors">Cadastrar</button>
            <div class="text-center mt-4">
                <p class="text-sm text-gray-500 mt-2">Já tem uma conta? <a onclick="navigate('login-screen')" class="text-blue-600 hover:underline cursor-pointer font-medium">Faça login</a></p>
            </div>
        </div>

        <!-- Tela Principal (Dashboard) com painéis de status -->
        <div id="dashboard-screen" class="screen">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-2xl font-bold text-gray-900">Suas Notas</h2>
                <button class="bg-blue-600 text-white p-3 rounded-full shadow-lg hover:bg-blue-700 transition-colors" onclick="navigate('note-screen')">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                </button>
            </div>
            <div class="relative mb-4 flex gap-2 items-center">
                <input type="text" id="search-input" placeholder="Buscar notas..." class="w-full pl-12 pr-4 py-3 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 absolute left-4 top-1/2 -translate-y-1/2 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <select id="filter-category" class="p-2 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">Todas Categorias</option>
                    <option value="Projeto">Projeto</option>
                    <option value="Pessoal">Pessoal</option>
                    <option value="Estudo">Estudo</option>
                    <option value="Trabalho">Trabalho</option>
                    <option value="Financeiro">Financeiro</option>
                </select>
                <select id="filter-status" class="p-2 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">Todos Status</option>
                    <option value="Pendente">Pendente</option>
                    <option value="Em Andamento">Em Andamento</option>
                    <option value="Concluído">Concluído</option>
                </select>
            </div>
            
            <!-- Painéis de status -->
            <div class="kanban-board overflow-auto">
                <div id="pending-column" class="flex flex-col bg-gray-100 p-3 rounded-xl shadow-inner" ondragover="allowDrop(event)" ondrop="drop(event, 'Pendente')">
                    <h3 class="text-lg font-semibold text-gray-700 mb-3 bg-red-200 p-2 rounded-lg text-center">Pendente</h3>
                    <div id="pending-list" class="flex flex-col gap-3">
                        </div>
                </div>

                <div id="in-progress-column" class="flex flex-col bg-gray-100 p-3 rounded-xl shadow-inner" ondragover="allowDrop(event)" ondrop="drop(event, 'Em Andamento')">
                    <h3 class="text-lg font-semibold text-gray-700 mb-3 bg-yellow-200 p-2 rounded-lg text-center">Em Andamento</h3>
                    <div id="in-progress-list" class="flex flex-col gap-3">
                        </div>
                </div>

                <div id="done-column" class="flex flex-col bg-gray-100 p-3 rounded-xl shadow-inner" ondragover="allowDrop(event)" ondrop="drop(event, 'Concluído')">
                    <h3 class="text-lg font-semibold text-gray-700 mb-3 bg-green-200 p-2 rounded-lg text-center">Concluído</h3>
                    <div id="done-list" class="flex flex-col gap-3">
                        </div>
                </div>
            </div>
            
            <button onclick="navigate('login-screen')" class="w-full bg-red-500 text-white p-4 rounded-xl font-semibold mt-auto hover:bg-red-600 transition-colors">Sair</button>
        </div>

        <!-- Tela de Criação/Edição de Nota -->
        <div id="note-screen" class="screen">
            <input type="text" id="note-title" placeholder="Título da Nota" class="w-full text-2xl font-bold border-none focus:outline-none focus:ring-0 p-0 mb-4">
            
            <div class="w-full flex-grow border border-gray-200 rounded-xl p-4 overflow-y-auto">
                <textarea id="note-content" class="w-full h-full text-gray-800 focus:outline-none resize-none" placeholder="Digite sua nota aqui..."></textarea>
            </div>
            
            <div class="flex flex-col gap-2 mt-4">
                <select id="note-status" class="w-full p-2 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option>Pendente</option>
                    <option>Em Andamento</option>
                    <option>Concluído</option>
                </select>
                <select id="note-category" class="w-full p-2 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">Sem Categoria</option>
                    <option value="Projeto">Projeto</option>
                    <option value="Pessoal">Pessoal</option>
                    <option value="Estudo">Estudo</option>
                    <option value="Trabalho">Trabalho</option>
                    <option value="Financeiro">Financeiro</option>
                </select>
            </div>

            <div class="flex justify-between items-center mt-4">
                <button onclick="handleSaveNote()" class="bg-green-500 text-white p-3 rounded-full shadow-lg hover:bg-green-600 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                </button>
                <div class="text-sm text-gray-500">Última modificação: agora</div>
            </div>

            <div class="flex items-center justify-between">
                <button onclick="navigate('dashboard-screen')" class="text-blue-600 hover:text-blue-700 transition-colors font-semibold flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" />
                    </svg>
                    Voltar
                </button>
                <div class="flex space-x-2">
                    <button id="delete-note-btn" onclick="handleDeleteNote()" class="text-red-600 p-2 rounded-full hover:bg-red-200 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Caixa de Mensagem Personalizada -->
    <div id="message-box" class="message-box"></div>

    <script src="js/script.js"></script>
</body>
</html>
