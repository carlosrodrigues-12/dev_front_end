<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/pagamento.css">

    <title>Pagamento</title>
  </head>
  <body>
    <header>
      <h2 class="container header-content">E-commerce</h2>
    </header>
    <div class="container">
      <div class="main-content">            
      <!-- Formulário de Pagamento -->
        <div class="payment-form">
          <h2 class="section-title">Pagamento</h2>
            <form id="paymentForm">
              <div class="form-group">
                <label class="form-label" for="cardType">Bandeira do Cartão</label>
                <div>
                  <div>
                    <input type="radio" value="visa" name="bandeira_cartao">
                    <label for="visa">Visa</label>
                  </div>
                  <div>
                    <input type="radio" value="mastercard" name="bandeira_cartao">
                    <label for="mastercard">Mastercard</label>
                  </div>
                  <div>
                    <input type="radio" value="american_express" name="bandeira_cartao">
                    <label for="american_express">American Express</label>
                  </div>
                </div>
                <input type="hidden" id="cardType" value="Visa">
              </div>
                    
              <div class="form-group">
                <label for="cardNumber" class="form-label">Número do Cartão</label>
                <input type="text" id="cardNumber" class="form-input" placeholder="1234 5678 9012 3456" maxlength="19" required>
              </div>
              
              <div class="form-row">
                <div class="form-group">
                  <label for="expiryDate" class="form-label">Data de Expiração</label>
                  <input type="text" id="expiryDate" class="form-input" placeholder="MM/AA" maxlength="5" required>
                </div>
                  
                <div class="form-group">
                  <label for="cvv" class="form-label">Código de Segurança</label>
                  <input type="text" id="cvv" class="form-input" placeholder="123" maxlength="4" required>
                </div>
              </div>
                    
              <div class="form-group">
                <label for="cardName" class="form-label">Nome impresso no cartão</label>
                <input type="text" id="cardName" class="form-input" placeholder="Como no cartão" required>
              </div>
                    
              <button type="button" class="submit-btn" onclick="window.location.href = '../compra/compra.html'">Finalizar Compra</button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
